<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>マーダーミステリー（マダミス）公演予約 | MMQ</title>
    <meta name="description" content="マーダーミステリー（マダミス）の公演検索・予約。全国の店舗から作品を探して、そのまま予約できます。" />
    <link rel="canonical" href="https://mmq.game/" />
    <meta property="og:title" content="マーダーミステリー（マダミス）公演予約 | MMQ" />
    <meta property="og:description" content="マーダーミステリー（マダミス）の公演検索・予約。全国の店舗から作品を探して、そのまま予約できます。" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:site_name" content="MMQ" />
    
    <!-- ファビコン -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    
    <!-- Preload 重要リソース（本番ビルド後のファイル名に合わせて調整） -->
    <!-- 注意: ビルド後に生成されるハッシュ付きファイル名は自動的に処理されます -->
    
    <!-- DNS Prefetch: Supabase への接続を事前解決（本番プロジェクト） -->
    <link rel="dns-prefetch" href="https://cznpcewciwywcqcxktba.supabase.co" />
    <link rel="preconnect" href="https://cznpcewciwywcqcxktba.supabase.co" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 古いキャッシュ検知: Reactロード前にビルドハッシュを比較し、古ければ自動リロード
      // インラインなのでバンドルキャッシュに依存しない
      (function(){
        // Supabase セッションの localStorage キー。
        // ⚠️ src/lib/supabase.ts の AUTH_STORAGE_KEY / storageKey と同じ値でなければならない。
        // インラインスクリプトなので import できず直書きしている。値がずれると
        // 「セッション確立済みかどうか」の判定が常に false になり、認証復帰直後に
        // リロードしてトークンを無駄にする（＝ログインできない）ため、片方だけ変えないこと。
        var AUTH_STORAGE_KEY = 'mmq-supabase-auth';
        if (sessionStorage.getItem('_vck')) return; // 無限ループ防止
        // 認証トークンがURLに含まれているか（Supabase のログイン復帰直後）
        // location.reload() はフラグメントを保持するので、リロード自体はフローを壊さない。
        // ただしセッション確立後にリロードするとローテーション済み refresh_token を
        // 再利用して失敗し得るため、後段でセッションの有無を見て判断する。
        var h = location.hash || '';
        var hasAuthTokenInUrl = h.indexOf('access_token=') !== -1 || h.indexOf('refresh_token=') !== -1 || h.indexOf('error=') !== -1;
        // 認証復帰中にリロードして良いか = まだセッションが確立していないか。
        // localStorage は private browsing 等で例外を投げ得るので、その場合は
        // 安全側（リロードしない）に倒す。
        function canReloadDuringAuth() {
          try {
            return localStorage.getItem(AUTH_STORAGE_KEY) === null;
          } catch (e) {
            return false;
          }
        }
        var scripts = document.querySelectorAll('script[type="module"][src]');
        var hash = null;
        for (var i = 0; i < scripts.length; i++) {
          var src = scripts[i].getAttribute('src');
          if (src && src.indexOf('/assets/index-') !== -1) {
            var m = src.match(/index-([^.]+)\.js/);
            if (m) hash = m[1];
          }
        }
        if (!hash) return; // 開発環境（ハッシュなし）はスキップ
        fetch('/?_t=' + Date.now(), { headers: { Accept: 'text/html' }, cache: 'no-cache' })
          .then(function(r) { return r.ok ? r.text() : null; })
          .then(function(html) {
            if (!html) return;
            var m = html.match(/index-([^.]+)\.js/);
            if (!m || m[1] === hash) return; // 最新のビルド
            // 判定はここ（リロードを決める直前）で行う。スクリプト実行時点では
            // supabase-js がまだ localStorage にセッションを書いていない。
            if (hasAuthTokenInUrl && !canReloadDuringAuth()) return; // ログイン成功済み → 更新は次回ナビゲーションに任せる
            sessionStorage.setItem('_vck', '1');
            location.reload();
          })
          .catch(function() {});
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
