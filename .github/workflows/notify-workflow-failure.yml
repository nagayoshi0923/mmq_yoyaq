# DISABLED 2026-08-08: Discord失敗通知は運用していないため停止。
# 再有効化する場合は on.workflow_run を復元し、GitHub Actions で Enable する。
name: Notify Discord (workflow failure)

on:
  workflow_dispatch: # 停止中（手動以外は起動しない）

jobs:
  notify:
    if: false
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Send failure to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          TITLE: ${{ github.event.workflow_run.display_title }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_URL が未設定のためスキップします"
            exit 0
          fi

          MSG="🚨 **GitHub Actions失敗**
          Workflow: ${WORKFLOW}
          Branch: ${BRANCH}
          ${TITLE}
          ${URL}"
          jq -n --arg content "$MSG" '{content: $content}' \
            | curl -sf -H "Content-Type: application/json" -d @- "$WEBHOOK"
