name: Mirror Production DB to Staging

on:
  schedule:
    # 毎日 AM 3:00 JST (= 18:00 UTC 前日)
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  mirror:
    name: Mirror Prod → Staging
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client 17
        # Ubuntu 標準の postgresql-client は 16 で、本番（PostgreSQL 17.6）に対して pg_dump が
        # 「server version mismatch」で止まる（2026-09-29 以降の毎日の失敗の原因）。PGDG から 17 を入れる。
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          pg_dump --version

      - name: Run mirror script
        env:
          PROD_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PROD_PASSWORD }}
          STAGING_DB_PASSWORD: ${{ secrets.SUPABASE_DB_STAGING_PASSWORD }}
        run: bash scripts/mirror-prod-to-staging.sh
