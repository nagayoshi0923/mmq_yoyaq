name: DB Drift

# 実環境の DB 構造が supabase/structure/*.json（記録済みの構造）とずれていないかを毎日確認する。
# ずれ = 記録されていない DB 変更。migration を足して記録するか、DB を戻す。
# 直接 DB 接続は Actions runner から通らないため Management API を使う。

on:
  schedule:
    - cron: '30 22 * * *'   # 毎日 07:30 JST
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/structure/**'
      - 'scripts/db-structure-snapshot.mjs'
      - '.github/workflows/db-drift.yml'

permissions:
  contents: read

jobs:
  drift:
    name: Drift check (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [staging, prod]
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Compare live ${{ matrix.env }} with supabase/structure/${{ matrix.env }}.json
        run: node scripts/db-structure-snapshot.mjs ${{ matrix.env }} --via-api --diff
