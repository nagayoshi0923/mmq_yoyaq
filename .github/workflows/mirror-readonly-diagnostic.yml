name: Mirror DB read-only diagnostic (one shot)

on:
  push:
    branches: [diag/mmq-mirror-readonly-20261001]
    paths:
      - .github/workflows/mirror-readonly-diagnostic.yml
      - scripts/mirror-readonly-preflight.py

permissions:
  contents: read

jobs:
  diagnose:
    name: Read-only connection and client compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the same PostgreSQL client package as the failed run
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Probe metadata only (no mirror, data dump, restore or masking)
        env:
          PROD_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PROD_PASSWORD }}
          STAGING_DB_PASSWORD: ${{ secrets.SUPABASE_DB_STAGING_PASSWORD }}
        run: python3 scripts/mirror-readonly-preflight.py
