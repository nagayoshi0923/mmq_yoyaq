name: CI

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]

jobs:
  verify:
    name: Verify (typecheck, lint, build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeCheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Coupon rules database regressions
        run: npm run test:coupon-rules-db

      - name: Staff account lifecycle database regressions
        run: npm run test:staff-account-db

      - name: Verify organization signup ownership
        run: npm run test:organization-signup-db

      - name: Guest PIN security database regressions
        run: npm run test:guest-pin-db

      - name: GM assignment database regressions
        run: npm run test:gm-assignment-db

      - name: Structure and kit transfer database regressions
        run: node scripts/test-structure-cleanup-db.mjs && node scripts/test-kit-transfer-identity-db.mjs

      - name: Private booking scenario capacity
        run: node scripts/test-private-booking-capacity-db.mjs --notice && node scripts/test-private-booking-capacity-db.mjs --notice --closure

      - name: Private booking change policy
        run: node scripts/test-private-change-policy-db.mjs

      - name: Unrecorded GM cost DB regression
        run: node scripts/test-unrecorded-gm-cost-db.mjs

      - name: Customer coupon stats DB regression
        run: node scripts/test-customer-search-db.mjs && node scripts/test-customer-reservation-amounts-db.mjs && node scripts/test-customer-coupon-stats-db.mjs && node scripts/test-customer-contact-scope-db.mjs && node scripts/test-customer-play-history-access-db.mjs && node scripts/test-customer-play-history-closure-db.mjs && node scripts/test-private-group-read-auth-db.mjs && node scripts/test-private-group-snapshot-db.mjs && node scripts/test-private-group-confirm-characters-db.mjs && node scripts/test-private-group-notice-scope-db.mjs && node scripts/test-private-group-character-method-db.mjs && node scripts/test-private-group-member-removal-db.mjs && node scripts/test-private-group-preferred-stores-db.mjs && node scripts/test-private-booking-request-notice-db.mjs && node scripts/test-private-booking-request-notice-db.mjs --closure

      - name: Private group candidate atomic save
        run: node scripts/test-private-group-candidate-add-db.mjs

      - name: Store public column boundary
        run: node scripts/test-store-public-columns.mjs
      - name: Survey question settings database regression
        run: node scripts/test-survey-question-settings-db.mjs && node scripts/test-private-group-direct-access-db.mjs
      - name: Duplicate unique constraint cleanup
        run: node scripts/test-duplicate-unique-constraints.mjs

      - name: Event datetime atomic sync regression
        run: node scripts/test-event-datetime-sync.mjs
      - name: GM response tenant integrity
        run: node scripts/test-gm-response-org-integrity.mjs && node scripts/test-gm-response-candidate-guard.mjs

      - name: Shared Edge authentication boundary
        run: node --test scripts/edge-security-boundary.test.mjs scripts/private-rejection-email-boundary.test.mjs

      - name: Cancelled recruitment database regressions
        run: node scripts/test-recruitment-cancelled-event-db.mjs

      - name: Discord entry release regression
        run: node --test scripts/check-discord-join-release.test.mjs scripts/discord-join-handler.test.mjs

      - name: Supabase release scope tests
        run: node --test scripts/supabase-release-scope.test.mjs

      - name: Lint
        run: npm run lint

      - name: Security guardrails
        run: npm run check:security-guardrails

      - name: JST date guard
        run: npm run check:jst-date

      - name: Cancellation ownership and staff flags
        run: node scripts/test-cancellation-owner-binding-db.mjs && node scripts/test-cancellation-group-notice-db.mjs && node scripts/test-cancellation-group-notice-db.mjs --closure && node scripts/test-plain-cancellation-staff-db.mjs && node scripts/test-customer-cancellation-policy-db.mjs && npx vitest run api/cancellation-flags-auth.test.ts api/cancellation-group-notice.test.ts api/customer-cancellation-policy.test.ts

      - name: Private rejection authorization and state
        run: node scripts/test-private-rejection-boundary-db.mjs && node scripts/test-private-rejection-atomic-db.mjs && TEST_REJECTION_DELIVERY=1 node scripts/test-private-rejection-atomic-db.mjs && node scripts/test-private-rejection-delivery-store.mjs && node scripts/test-private-rejection-cron.mjs && node --test scripts/private-rejection-worker-auth.test.mjs && npx vitest run src/lib/privateRejectionDelivery.test.ts src/pages/PrivateBookingManagement/hooks/useBookingApproval.test.tsx src/pages/PrivateBookingManagement/components/BookingRequestCard.delivery.test.tsx

      - name: Unrequested private group cancellation
        run: node scripts/test-unrequested-group-cancel-db.mjs && npx vitest run src/hooks/usePrivateGroup.test.tsx

      - name: Design token guard
        run: npm run check:design-tokens

      - name: org_scope guard
        run: npm run check:org-scope

      - name: Audit anon RLS / GRANT consistency
        # Supabase Management API (HTTPS) 経由で staging に対して監査クエリを投げる。
        # 直接 DB 接続 (db.<ref>.supabase.co) は GitHub Actions runner の IPv6 不通で使えない。
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run check:anon-rls-grants

      - name: Build
        run: npm run build:fast
