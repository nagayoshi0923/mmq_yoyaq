# 不具合再現用のローカル Supabase（本番・ステージングには接続しない）
# スキーマはステージングの構造ダンプ（データなし）から作り、テストデータは seed.sql で入れる。
project_id = "mmq-local-repro"

[api]
enabled = true
port = 55321
max_rows = 1000

[db]
port = 55322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 55323

[inbucket]
enabled = true
port = 55324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**"]
jwt_expiry = 604800

[auth.email]
enable_signup = true
enable_confirmations = false
